# Herstel database: zet de Lovable-export in het NIEUWE Supabase-project.
#
# Waarom een GitHub-workflow en niet Claude's eigen omgeving: het terugzetten
# heeft een rechtstreekse databaseverbinding nodig (poort 5432), en die laat de
# Claude-omgeving niet door. GitHub-runners wel. Alle andere verhuisstappen
# (bestanden, edge functions, omschakelen) gaan wél vanuit Claude; zie
# docs/migratie-supabase.md.
#
# Handmatig starten via Actions → "Herstel database" → Run workflow. Vooraf:
#   1. Het exportbestand (bureauvlieland_<datum>.backup) uploaden in het nieuwe
#      project: Storage → bucket "migratie". De bucket bestaat al en is privé.
#   2. Twee repository secrets (Settings → Secrets and variables → Actions):
#        SUPABASE_DB_PASSWORD       databasewachtwoord van het nieuwe project
#        SUPABASE_SERVICE_ROLE_KEY  service_role key (Project Settings → API)
#      SUPABASE_DB_PASSWORD gebruikt deploy-supabase.yml straks ook.
#
# De workflow weigert te draaien als de database al tabellen bevat, tenzij
# "overschrijven" is aangevinkt. Zo kan een tweede klik geen schade doen.
#
# Wat hij doet, in volgorde: exportbestand ophalen, pg_restore in drie fasen
# (supabase/scripts/restore-from-lovable.sh), nascript met cron-jobs,
# migratiehistorie en controles (supabase/scripts/after-restore.sql). De logs
# komen als artifact bij de run te staan.

name: Herstel database

on:
  workflow_dispatch:
    inputs:
      bestand:
        description: "Naam van het exportbestand in bucket 'migratie' (bijv. bureauvlieland_260907.backup)"
        required: true
      overschrijven:
        description: "Database bevat al tabellen: toch doorgaan (verwijdert eerst alles in public)"
        type: boolean
        default: false

# Nooit twee herstelacties tegelijk.
concurrency:
  group: restore-database
  cancel-in-progress: false

env:
  # Dezelfde waarden als in supabase/scripts/run-migration.sh. Het project-ref
  # in supabase/config.toml wijst tot de omschakeling nog naar het oude project,
  # daarom staat het nieuwe ref hier expliciet.
  NEW_REF: utshmnyrjzwtrpttxdlw
  NEW_URL: https://utshmnyrjzwtrpttxdlw.supabase.co
  NEW_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV0c2htbnlyanp3dHJwdHR4ZGx3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3OTEwMTksImV4cCI6MjEwNDM2NzAxOX0.FR8Ia5dJaNtoL5yGBhiidmW1VKR1gvl-B29C7JnpZ9I
  OLD_URL: https://blhspuifehausilnzwio.supabase.co
  POOLER_HOST: aws-1-eu-west-1.pooler.supabase.com
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  restore:
    name: Export terugzetten in het nieuwe project
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Controleer geheimen
        run: |
          ok=true
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then echo "::error::Repository secret SUPABASE_DB_PASSWORD ontbreekt."; ok=false; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "::error::Repository secret SUPABASE_SERVICE_ROLE_KEY ontbreekt."; ok=false; fi
          $ok

      # De export komt uit pg_dump 18; pg_restore 16 (standaard op de runner)
      # weigert het bestand. Daarom de PostgreSQL-apt-repo en versie 18.
      - name: PostgreSQL 18 client installeren
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_restore --version

      - name: Databaseverbinding samenstellen
        id: db
        run: |
          pw="$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"],safe=""))')"
          url="postgresql://postgres.${NEW_REF}:${pw}@${POOLER_HOST}:5432/postgres"
          echo "::add-mask::$pw"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          psql "$url" -Atc "select version();"

      - name: Is de database leeg?
        env:
          NEW_DB_URL: ${{ steps.db.outputs.url }}
        run: |
          set -euo pipefail
          n=$(psql "$NEW_DB_URL" -Atc "select count(*) from information_schema.tables where table_schema='public';")
          echo "Tabellen in public: $n"
          if [ "$n" != "0" ]; then
            if [ "${{ github.event.inputs.overschrijven }}" != "true" ]; then
              echo "::error::De database bevat al $n tabellen. Vink 'overschrijven' aan als je de vorige poging wilt vervangen."
              exit 1
            fi
            echo "Overschrijven aangevinkt: schema public wordt leeggemaakt."
            psql "$NEW_DB_URL" -v ON_ERROR_STOP=1 -c "drop schema public cascade; create schema public; grant usage on schema public to postgres, anon, authenticated, service_role; grant all on schema public to postgres, service_role;"
            psql "$NEW_DB_URL" -v ON_ERROR_STOP=1 -c "truncate auth.users cascade; truncate storage.objects cascade;"
            psql "$NEW_DB_URL" -v ON_ERROR_STOP=1 -c "select cron.unschedule(jobid) from cron.job;"
            psql "$NEW_DB_URL" -v ON_ERROR_STOP=1 -c "delete from supabase_migrations.schema_migrations;" || true
          fi

      - name: Exportbestand ophalen uit bucket migratie
        run: |
          set -euo pipefail
          f="${{ github.event.inputs.bestand }}"
          code=$(curl -sS -o export.backup -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            "$NEW_URL/storage/v1/object/authenticated/migratie/$f")
          if [ "$code" != "200" ]; then
            echo "::error::Bestand '$f' niet gevonden in bucket migratie (HTTP $code). Controleer de naam in Storage → migratie."
            head -c 500 export.backup; echo
            exit 1
          fi
          ls -l export.backup
          pg_restore --list export.backup | head -5

      - name: Terugzetten (drie fasen)
        env:
          NEW_DB_URL: ${{ steps.db.outputs.url }}
        run: supabase/scripts/restore-from-lovable.sh export.backup

      - name: Nascript (cron-jobs, migratiehistorie, controles)
        env:
          NEW_DB_URL: ${{ steps.db.outputs.url }}
        run: |
          set -euo pipefail
          old_key="$(grep '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env | cut -d'"' -f2)"
          psql "$NEW_DB_URL" -v ON_ERROR_STOP=1 \
            -v old_url="$OLD_URL" -v new_url="$NEW_URL" \
            -v old_key="$old_key" -v new_key="$NEW_ANON_KEY" \
            -f supabase/scripts/after-restore.sql | tee after-restore.log

      - name: Onverwachte fouten in de restore-logs
        if: always()
        run: |
          # Fouten over onderdelen die Supabase zelf al heeft zijn normaal; alle andere niet.
          if [ -f restore-pre-data.log ]; then
            grep -hE "error:" restore-*.log \
              | grep -vE "extensions|graphql_public|vault|pg_cron|pg_net|supabase_vault" \
              | sort | uniq -c | sort -rn > onverwacht.log || true
            n=$(wc -l < onverwacht.log)
            if [ "$n" != "0" ]; then
              echo "::warning::$n soorten onverwachte foutregels in de restore-logs; zie artifact 'restore-logs'."
              head -30 onverwacht.log
            else
              echo "Geen onverwachte fouten."
            fi
          fi

      - name: Samenvatting
        if: always()
        env:
          NEW_DB_URL: ${{ steps.db.outputs.url }}
        run: |
          {
            echo "## Herstel database"
            echo
            echo "- Project: \`$NEW_REF\`"
            echo "- Bestand: \`${{ github.event.inputs.bestand }}\`"
            echo
            echo "| Controle | Waarde | Verwacht (export 7 sep) |"
            echo "|---|---|---|"
            q() { psql "$NEW_DB_URL" -Atc "$1" 2>/dev/null || echo "?"; }
            echo "| Tabellen in public | $(q "select count(*) from information_schema.tables where table_schema='public'") | 67 |"
            echo "| Gebruikers | $(q "select count(*) from auth.users") | 41 |"
            echo "| Gebruikers met wachtwoord | $(q "select count(encrypted_password) from auth.users") | 41 |"
            echo "| Bestandsrijen in storage | $(q "select count(*) from storage.objects where bucket_id not like 'database_export%' and bucket_id <> 'migratie'") | 250 |"
            echo "| Cron-jobs | $(q "select count(*) from cron.job") | 16 |"
            echo "| Cron-jobs die nog naar het oude project wijzen | $(q "select count(*) from cron.job where command like '%$OLD_URL%'") | 0 |"
            echo "| Migraties in historie | $(q "select count(*) from supabase_migrations.schema_migrations") | $(ls supabase/migrations/*.sql | wc -l) |"
            echo
            if [ -s onverwacht.log ]; then echo "Onverwachte foutregels: $(wc -l < onverwacht.log) soorten, zie artifact."; else echo "Geen onverwachte fouten in de restore-logs."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-logs
          path: |
            restore-*.log
            after-restore.log
            onverwacht.log
          if-no-files-found: ignore
